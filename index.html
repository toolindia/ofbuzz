<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofbuzz Technology — Portal Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #f25c3b;
      --primary-dark: #d94827;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .hub-card { background: var(--surface); width: 100%; max-width: 440px; border-radius: var(--radius); padding: 36px 28px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.08); border: 1px solid var(--border); text-align: center; }
    .brand-logo { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; margin-bottom: 14px; }
    .hub-title { font-size: 1.35rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .hub-sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 28px; line-height: 1.4; }
    .nav-buttons { display: flex; flex-direction: column; gap: 12px; }
    .portal-btn { padding: 14px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; text-decoration: none; display: block; transition: all 0.2s ease; }
    .btn-admin { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(242, 92, 59, 0.25); }
    .btn-admin:hover { background: var(--primary-dark); }
    .btn-staff { background: #0ea5e9; color: #fff; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25); }
    .btn-staff:hover { background: #0284c7; }
    .hub-footer { margin-top: 24px; font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="hub-card">
    <img src="https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg" class="brand-logo" alt="Ofbuzz Logo" referrerpolicy="no-referrer">
    <h1 class="hub-title">Ofbuzz Technology</h1>
    <p class="hub-sub">Select your workspace portal below to access operations, billing ledgers, or workforce tools.</p>
    
    <div class="nav-buttons">
      <a href="admin.html" class="portal-btn btn-admin">Admin Studio & Billing Console</a>
      <a href="staff.html" class="portal-btn btn-staff">Workforce Workspace & Live Chat</a>
    </div>

    <div class="hub-footer">
      &copy; 2026 Ofbuzz Technology. All rights reserved.
    </div>
  </div>

</body>
</html>
