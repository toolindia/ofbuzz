<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Directory - Ofbuzz Technology</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8f9fa; color: #212529; margin: 0; padding: 16px; }
    .container { max-width: 720px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 8px; border: 1px solid #e9ecef; }
    .header { text-align: center; border-bottom: 1px solid #f1f3f5; padding-bottom: 18px; margin-bottom: 20px; }
    .logo { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    h1 { font-size: 20px; margin: 10px 0 4px; font-weight: 600; }
    p.subtitle { color: #6c757d; margin: 0; font-size: 14px; }
    .client-card { border: 1px solid #e9ecef; border-radius: 6px; padding: 14px; margin-bottom: 10px; background: #fafbfc; }
    .client-card h3 { margin: 0; font-size: 15px; color: #111827; }
    .client-card p { margin: 6px 0 0; font-size: 13px; color: #4b5563; }
    .badge { display: inline-block; padding: 3px 8px; font-size: 11px; border-radius: 4px; background: #e6f4ea; color: #137333; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg" class="logo" alt="Ofbuzz Logo">
      <h1>Ofbuzz Technology</h1>
      <p class="subtitle">Live Active Clients</p>
    </div>
    <div id="clientList">Fetching directory...</div>
  </div>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycby9yiIo9euB9KTt0zBuwcF3x6pdaeJJ48mAwcTFC6xl53oH8eh0Agfwlr138t3D5KNPYQ/exec";

    function renderClients(clients) {
      var box = document.getElementById("clientList");
      if (!clients || clients.length === 0) {
        box.innerHTML = "<p style='color:#6c757d; font-size:14px;'>No active clients found.</p>";
        return;
      }
      var html = "";
      clients.forEach(function(c) {
        html += '<div class="client-card">';
        html += '  <div style="display:flex; justify-content:space-between; align-items:center;">';
        html += '    <h3>' + c.name + '</h3>';
        html += '    <span class="badge">' + c.status + '</span>';
        html += '  </div>';
        html += '  <p>' + (c.services || 'Active Retainer') + '</p>';
        html += '</div>';
      });
      box.innerHTML = html;
    }

    window.onload = function() {
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run.withSuccessHandler(renderClients).getLiveClients();
      } else {
        fetch(API_URL + "?action=getLiveClients")
          .then(function(res) { return res.json(); })
          .then(renderClients);
      }
    };
  </script>
</body>
</html>
