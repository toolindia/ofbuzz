<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Directory - Ofbuzz Technology</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8f9fa; color: #212529; margin: 0; padding: 16px; }
    .container { max-width: 680px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; }
    .header { text-align: center; border-bottom: 1px solid #f1f3f5; padding-bottom: 14px; margin-bottom: 18px; }
    .logo { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; display: block; margin: 0 auto 10px auto; }
    h1 { font-size: 19px; margin: 0 0 4px; }
    .client-card { border: 1px solid #e9ecef; border-radius: 6px; padding: 12px; margin-bottom: 10px; background: #fafbfc; }
    .badge { display: inline-block; padding: 3px 8px; font-size: 11px; border-radius: 4px; background: #e6f4ea; color: #137333; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="<?= logoUrl ?>" class="logo" alt="Ofbuzz Technology Logo" referrerpolicy="no-referrer">
      <h1>Ofbuzz Technology</h1>
      <p style="color:#6c757d; margin:0; font-size:13px;">Live Active Clients</p>
    </div>
    <div id="list">Loading clients directly</div>
  </div>

  <script>
    function renderClients(clients) {
      var box = document.getElementById("list");
      if (!clients || clients.length === 0) {
        box.innerHTML = "<p style='font-size:13px; color:#6c757d; text-align:center;'>No active clients found.</p>";
        return;
      }
      var h = "";
      clients.forEach(function(c) {
        h += "<div class='client-card'>" +
             "  <div style='display:flex; justify-content:space-between; align-items:center;'>" +
             "    <strong>" + c.name + "</strong>" +
             "    <span class='badge'>" + c.status + "</span>" +
             "  </div>" +
             "  <p style='margin:5px 0 0; font-size:13px; color:#495057;'>" + (c.services || "Active Retainer") + "</p>" +
             "</div>";
      });
      box.innerHTML = h;
    }

    window.onload = function() {
      google.script.run
        .withSuccessHandler(renderClients)
        .withFailureHandler(function(err) {
          document.getElementById("list").innerHTML = "<p style='color:#dc3545;'>Error loading clients: " + err.message + "</p>";
        })
        .getLiveClients();
    };
  </script>
</body>
</html>
