<script>
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycby9yiIo9euB9KTt0zBuwcF3x6pdaeJJ48mAwcTFC6xl53oH8eh0Agfwlr138t3D5KNPYQ/exec";
    const BRAND_LOGO_URL = "https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg";
    const SECURE_PIN = "1312";

    let state = {
      clients: [],
      staff: [],
      tasks: [],
      payments: []
    };

    let currentInvoice = {
      client: null,
      lineItems: [],
      customItems: [],
      advances: [],
      calculatedNextDue: "",
      financials: {}
    };

    let activeTimeFilter = "all";
    let activeClientCategory = "all";
    let lineChartInstance = null;
    let mixChartInstance = null;

    function validateAdminPin() {
      const input = document.getElementById("adminPinInput");
      const errorMsg = document.getElementById("authErrorMsg");
      
      if (input.value.trim() === SECURE_PIN) {
        sessionStorage.setItem("ofbuzz_admin_auth", "true");
        document.getElementById("authOverlay").style.display = "none";
        document.getElementById("mainDashboard").style.display = "block";
        errorMsg.style.display = "none";
        syncAllData();
      } else {
        errorMsg.style.display = "block";
        input.value = "";
        input.focus();
      }
    }

    function handlePinKeyPress(e) {
      if (e.key === "Enter") {
        validateAdminPin();
      }
    }

    function lockAdminSession() {
      sessionStorage.removeItem("ofbuzz_admin_auth");
      document.getElementById("authOverlay").style.display = "flex";
      document.getElementById("mainDashboard").style.display = "none";
      document.getElementById("adminPinInput").value = "";
      document.getElementById("authErrorMsg").style.display = "none";
      document.getElementById("adminPinInput").focus();
    }

    function checkAuthOnLoad() {
      if (sessionStorage.getItem("ofbuzz_admin_auth") === "true") {
        document.getElementById("authOverlay").style.display = "none";
        document.getElementById("mainDashboard").style.display = "block";
        syncAllData();
      } else {
        document.getElementById("authOverlay").style.display = "flex";
        document.getElementById("mainDashboard").style.display = "none";
        document.getElementById("adminPinInput").focus();
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    function jsonp(url, callbackName) {
      const script = document.createElement("script");
      const connector = url.indexOf("?") >= 0 ? "&" : "?";
      script.src = url + connector + "callback=" + callbackName + "&_t=" + Date.now();
      document.body.appendChild(script);
      script.onload = () => script.remove();
      script.onerror = () => {
        script.remove();
        showToast("Network request failed. Please check connectivity.");
      };
    }

    function syncAllData() {
      const btn = document.getElementById("btnRefresh");
      if (btn) {
        btn.disabled = true;
        btn.innerText = "Refreshing...";
      }
      showToast("Fetching latest records...");
      jsonp(API_ENDPOINT + "?action=getAdminData", "onAdminSync");
    }

    window.onAdminSync = function(res) {
      const btn = document.getElementById("btnRefresh");
      if (btn) {
        btn.disabled = false;
        btn.innerText = "Refresh Data";
      }

      if (res && res.success && res.data) {
        state = res.data;
        renderAdminDashboard();
        renderPaymentLedger();
        renderMetaAnalytics();
        showToast("System synchronized successfully.");
      } else {
        showToast("Error retrieving records.");
      }
    };

    function toggleAnalyticsDrawer() {
      const panel = document.getElementById("analyticsPanel");
      const btn = document.getElementById("btnToggleAnalytics");
      if (panel.style.display === "block") {
        panel.style.display = "none";
        btn.innerText = "Analytics View";
      } else {
        panel.style.display = "block";
        btn.innerText = "Close Analytics";
        renderMetaAnalytics();
      }
    }

    function openStaffModal() {
      document.getElementById("staffManagementModal").style.display = "flex";
    }

    function closeStaffModal() {
      document.getElementById("staffManagementModal").style.display = "none";
    }

    function setTimeFilter(filter, el) {
      activeTimeFilter = filter;
      document.querySelectorAll(".time-pill").forEach(btn => btn.classList.remove("active"));
      if (el) el.classList.add("active");
      renderMetaAnalytics();
    }

    function setClientCategoryFilter(cat, el) {
      activeClientCategory = cat;
      document.querySelectorAll(".cat-pill").forEach(btn => btn.classList.remove("active"));
      if (el) el.classList.add("active");
      renderAdminDashboard();
    }

    // PAYMENT LEDGER & AUTOMATIC DUE CALCULATIONS
    function renderPaymentLedger() {
      const tbody = document.getElementById("recoveryLedgerBody");
      let totalReceivedAll = 0;
      let totalPendingAll = 0;
      let rowsHtml = "";

      const now = new Date();
      const todayDateStr = now.toISOString().split("T")[0];
      let calculatedTodaySales = 0;

      (state.clients || []).forEach(c => {
        const status = String(c[11] || "").trim().toLowerCase();
        if (status === "cancelled") return;

        const clientId = String(c[0] || "").trim();
        const clientName = c[1] || "Account";
        const phone = c[2] || "—";
        const email = c[3] || "—";

        const oneTime = parseFloat(c[5]) || 0;
        const monthly = parseFloat(c[7]) || 0;
        const annual = parseFloat(c[9]) || 0;
        const clientBilled = oneTime + monthly + annual;

        const billingDate = String(c[10] || "").substring(0, 10);
        if (billingDate === todayDateStr) {
          calculatedTodaySales += clientBilled;
        }

        let clientPaid = 0;
        (state.payments || []).forEach(p => {
          if (String(p[1] || "").trim() === clientId) {
            clientPaid += parseFloat(p[4]) || 0;
          }
        });

        const pendingDue = Math.max(0, clientBilled - clientPaid);
        totalReceivedAll += clientPaid;
        totalPendingAll += pendingDue;

        rowsHtml += `
          <tr>
            <td><strong>${clientName}</strong><br><span style="font-size:0.75rem; color:#64748b;">${clientId}</span></td>
            <td>${phone}<br><span style="font-size:0.75rem; color:#64748b;">${email}</span></td>
            <td><strong>INR ${clientBilled.toFixed(2)}</strong></td>
            <td style="color:#059669; font-weight:700;">INR ${clientPaid.toFixed(2)}</td>
            <td style="color:${pendingDue > 0 ? '#ea580c' : '#64748b'}; font-weight:700;">INR ${pendingDue.toFixed(2)}</td>
            <td style="text-align: right; white-space: nowrap;">
              <button class="btn-profile" onclick="openCustomerProfileModal('${clientId}')">View Passbook</button>
              <button class="btn-adjust" onclick="openPaymentAdjustmentModal('${clientId}')">Adjust Payment</button>
              ${pendingDue > 0 ? `<button class="btn-reminder" onclick="sendPaymentReminderMail('${clientId}', '${pendingDue.toFixed(2)}')">Send Reminder</button>` : `<span style="font-size:0.75rem; color:#059669; font-weight:700; margin-left:6px;">Settled</span>`}
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = rowsHtml || '<tr><td colspan="6" style="text-align:center;">No active accounts available in ledger.</td></tr>';
      
      document.getElementById("todaySales").innerText = "INR " + calculatedTodaySales.toFixed(2);
      document.getElementById("kpiTotalPaid").innerText = "INR " + totalReceivedAll.toFixed(2);
      document.getElementById("kpiTotalPending").innerText = "INR " + totalPendingAll.toFixed(2);
    }

    // CUSTOMER PASSBOOK VIEW
    function openCustomerProfileModal(clientId) {
      const c = (state.clients || []).find(item => String(item[0]).trim() === String(clientId).trim());
      if (!c) return;

      const oneTime = parseFloat(c[5]) || 0;
      const monthly = parseFloat(c[7]) || 0;
      const annual = parseFloat(c[9]) || 0;
      const clientBilled = oneTime + monthly + annual;

      let clientPaid = 0;
      let historyRows = "";

      (state.payments || []).forEach(p => {
        if (String(p[1] || "").trim() === String(clientId).trim()) {
          const amt = parseFloat(p[4]) || 0;
          clientPaid += amt;
          historyRows += `
            <tr>
              <td>${p[5] ? String(p[5]).substring(0, 10) : "—"}</td>
              <td><span class="status-badge" style="${amt < 0 ? 'background:#fee2e2; color:#dc2626;' : ''}">${p[3] || 'Installment'}</span></td>
              <td style="font-weight:700; color:${amt < 0 ? '#dc2626' : '#059669'};">INR ${amt.toFixed(2)}</td>
              <td style="font-size:0.78rem; color:#64748b;">${p[6] || '—'}</td>
            </tr>
          `;
        }
      });

      const pendingDue = Math.max(0, clientBilled - clientPaid);

      document.getElementById("profClientName").innerText = `${c[1]}`;
      document.getElementById("profClientDetails").innerText = `Client ID: ${c[0]} | Phone: ${c[2] || '—'} | Email: ${c[3] || '—'}`;
      document.getElementById("profBilledAmt").innerText = `INR ${clientBilled.toFixed(2)}`;
      document.getElementById("profReceivedAmt").innerText = `INR ${clientPaid.toFixed(2)}`;
      document.getElementById("profPendingAmt").innerText = `INR ${pendingDue.toFixed(2)}`;
      document.getElementById("profPaymentsHistoryBody").innerHTML = historyRows || '<tr><td colspan="4" style="text-align:center;">No payment records found.</td></tr>';

      document.getElementById("customerProfileModal").style.display = "flex";
    }

    function closeCustomerProfileModal() {
      document.getElementById("customerProfileModal").style.display = "none";
    }

    function openPaymentAdjustmentModal(clientId) {
      const c = (state.clients || []).find(item => String(item[0]).trim() === String(clientId).trim());
      if (!c) return;

      const oneTime = parseFloat(c[5]) || 0;
      const monthly = parseFloat(c[7]) || 0;
      const annual = parseFloat(c[9]) || 0;
      const clientBilled = oneTime + monthly + annual;

      let clientPaid = 0;
      (state.payments || []).forEach(p => {
        if (String(p[1] || "").trim() === String(clientId).trim()) {
          clientPaid += parseFloat(p[4]) || 0;
        }
      });

      document.getElementById("adjClientId").value = c[0];
      document.getElementById("adjClientName").innerText = `${c[1]} (${c[0]})`;
      document.getElementById("adjBilledVal").innerText = `INR ${clientBilled.toFixed(2)}`;
      document.getElementById("adjCurrentPaidVal").innerText = `INR ${clientPaid.toFixed(2)}`;
      document.getElementById("adjActionType").value = "add";
      document.getElementById("adjAmount").value = "";
      document.getElementById("adjRemark").value = "";

      document.getElementById("paymentAdjustmentModal").style.display = "flex";
    }

    function closePaymentAdjustmentModal() {
      document.getElementById("paymentAdjustmentModal").style.display = "none";
    }

    function savePaymentAdjustment() {
      const clientId = document.getElementById("adjClientId").value;
      const amount = parseFloat(document.getElementById("adjAmount").value) || 0;
      const type = document.getElementById("adjActionType").value;
      const remark = document.getElementById("adjRemark").value.trim();

      if (amount <= 0) {
        showToast("Please enter a valid amount greater than 0.");
        return;
      }

      const btn = document.getElementById("btnSaveAdjustment");
      btn.disabled = true;
      btn.innerText = "Saving Adjustment...";

      window.onAdjustmentSaved = function(res) {
        btn.disabled = false;
        btn.innerText = "Save Adjustment & Recalculate";
        if (res && res.success) {
          showToast(type === "deduct" ? "Deduction/Correction recorded." : "Payment addition recorded.");
          closePaymentAdjustmentModal();
          syncAllData();
        } else {
          showToast("Failed to save payment adjustment.");
        }
      };

      jsonp(API_ENDPOINT + `?action=adjustClientPayment&clientId=${encodeURIComponent(clientId)}&amount=${encodeURIComponent(amount)}&type=${encodeURIComponent(type)}&remark=${encodeURIComponent(remark)}`, "onAdjustmentSaved");
    }

    // DIRECT ROBUST HANDLERS FOR CANCEL AND DELETE BUTTONS
    function cancelClientService(clientId) {
      if (!confirm("Are you sure you want to cancel/deactivate service for client " + clientId + "?")) return;
      showToast("Processing cancellation...");
      
      window.onServiceCancelled = function(res) {
        if (res && res.success) {
          showToast("Client service successfully cancelled.");
          syncAllData();
        } else {
          showToast("Failed to cancel service.");
        }
      };
      
      jsonp(API_ENDPOINT + `?action=deactivateClient&clientId=${encodeURIComponent(clientId)}`, "onServiceCancelled");
    }

    function deleteClientRecord(id) {
      if (!confirm("Are you sure you want to delete client " + id + "?")) return;
      showToast("Deleting client record...");
      
      window.onClientDeleted = function(res) {
        if (res && res.success) {
          showToast("Client record removed.");
          syncAllData();
        } else {
          showToast("Failed to delete client.");
        }
      };

      jsonp(API_ENDPOINT + `?action=deleteClient&clientId=${encodeURIComponent(id)}`, "onClientDeleted");
    }

    function sendPaymentReminderMail(clientId, dueAmt) {
      showToast("Dispatching formal payment reminder...");
      jsonp(API_ENDPOINT + `?action=sendPaymentReminder&clientId=${encodeURIComponent(clientId)}&amount=${encodeURIComponent(dueAmt)}`, "onReminderDispatched");
    }

    window.onReminderDispatched = function(res) {
      if (res && res.success) {
        showToast(res.message);
      } else {
        showToast((res && res.message) ? res.message : "Failed to dispatch reminder.");
      }
    };

    function renderMetaAnalytics() {
      const now = new Date();
      let filterStartDate = null;

      if (activeTimeFilter === "today") {
        filterStartDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      } else if (activeTimeFilter === "7d") {
        filterStartDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      } else if (activeTimeFilter === "30d") {
        filterStartDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
      } else if (activeTimeFilter === "month") {
        filterStartDate = new Date(now.getFullYear(), now.getMonth(), 1);
      }

      let totalCollected = 0;
      const timelineBuckets = {};

      (state.payments || []).forEach(p => {
        const pDateStr = String(p[5] || "").substring(0, 10);
        const pDate = new Date(pDateStr);
        const amt = parseFloat(p[4]) || 0;

        if (!filterStartDate || pDate >= filterStartDate) {
          totalCollected += amt;
          const bucketKey = pDateStr.length >= 7 ? pDateStr : "Current";
          timelineBuckets[bucketKey] = (timelineBuckets[bucketKey] || 0) + amt;
        }
      });

      let totalGross = 0;
      let totalMrr = 0;
      let oneTimeSum = 0;
      let monthlySum = 0;
      let annualSum = 0;
      let activeAccounts = 0;

      (state.clients || []).forEach(c => {
        const status = String(c[11] || "").trim().toLowerCase();
        if (status === "cancelled") return;

        const cDate = c[12] ? new Date(c[12]) : null;
        if (!filterStartDate || (cDate && cDate >= filterStartDate)) {
          const ot = parseFloat(c[5]) || 0;
          const mo = parseFloat(c[7]) || 0;
          const an = parseFloat(c[9]) || 0;

          oneTimeSum += ot;
          monthlySum += mo;
          annualSum += an;

          totalGross += (ot + mo + an);
          totalMrr += mo;
          activeAccounts++;
        }
      });

      const outstandingDue = Math.max(0, totalGross - totalCollected);

      let tasksTotal = (state.tasks || []).length;
      let tasksDone = (state.tasks || []).filter(t => t[6] === "Approved").length;
      let fulfillmentPct = tasksTotal > 0 ? Math.round((tasksDone / tasksTotal) * 100) : 100;

      document.getElementById("metaKpiGross").innerText = "INR " + totalGross.toLocaleString("en-IN");
      document.getElementById("metaKpiMrr").innerText = "INR " + totalMrr.toLocaleString("en-IN");
      document.getElementById("metaKpiPaid").innerText = "INR " + totalCollected.toLocaleString("en-IN");
      document.getElementById("metaKpiDue").innerText = "INR " + outstandingDue.toLocaleString("en-IN");
      document.getElementById("metaKpiClients").innerText = activeAccounts;
      document.getElementById("metaKpiClientsSub").innerText = activeAccounts + " active accounts in scope";
      document.getElementById("metaKpiFulfillment").innerText = fulfillmentPct + "%";
      document.getElementById("metaKpiFulfillmentSub").innerText = tasksDone + " of " + tasksTotal + " deliverables closed";

      let collectionEff = totalGross > 0 ? Math.min(100, Math.round((totalCollected / totalGross) * 100)) : 100;
      document.getElementById("collectionPercentText").innerText = collectionEff + "%";
      document.getElementById("collectionProgressBar").style.width = collectionEff + "%";

      renderTimelineChart(timelineBuckets);
      renderServiceMixChart(oneTimeSum, monthlySum, annualSum);
    }

    function renderTimelineChart(buckets) {
      const canvas = document.getElementById("revenueLineChart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      let labels = Object.keys(buckets).sort();
      let data = labels.map(k => buckets[k]);

      if (labels.length === 0) {
        labels = ["Current Period"];
        data = [0];
      }

      if (lineChartInstance) lineChartInstance.destroy();

      const gradient = ctx.createLinearGradient(0, 0, 0, 200);
      gradient.addColorStop(0, "rgba(24, 119, 242, 0.35)");
      gradient.addColorStop(1, "rgba(24, 119, 242, 0.0)");

      lineChartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Collections (INR)",
            data: data,
            borderColor: "#1877f2",
            borderWidth: 2.5,
            fill: true,
            backgroundColor: gradient,
            tension: 0.35,
            pointBackgroundColor: "#1877f2",
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(ctx) {
                  return " Revenue: INR " + ctx.parsed.y.toLocaleString("en-IN");
                }
              }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11 } } },
            y: {
              grid: { color: "#f1f5f9" },
              ticks: { callback: function(val) { return "INR " + val; }, font: { size: 11 } }
            }
          }
        }
      });
    }

    function renderServiceMixChart(oneTime, monthly, annual) {
      const canvas = document.getElementById("serviceMixChart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const hasData = (oneTime + monthly + annual) > 0;
      const dataValues = hasData ? [oneTime, monthly, annual] : [1, 1, 1];
      const backgroundColors = hasData ? ["#f25c3b", "#1877f2", "#10b981"] : ["#e2e8f0", "#e2e8f0", "#e2e8f0"];

      if (mixChartInstance) mixChartInstance.destroy();

      mixChartInstance = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: ["One-Time Setup", "Monthly Retainer", "Annual AMC"],
          datasets: [{
            data: dataValues,
            backgroundColor: backgroundColors,
            borderWidth: 2,
            borderColor: "#ffffff"
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "70%",
          plugins: {
            legend: { position: "right", labels: { boxWidth: 10, font: { size: 10 } } },
            tooltip: {
              callbacks: {
                label: function(ctx) {
                  const val = hasData ? "INR " + ctx.raw.toLocaleString("en-IN") : "No data";
                  return " " + ctx.label + ": " + val;
                }
              }
            }
          }
        }
      });
    }

    function renderAdminDashboard() {
      const clientBody = document.getElementById("clientTableBody");
      let cHtml = "";
      
      (state.clients || []).forEach(c => {
        const status = String(c[11] || "").trim().toLowerCase();
        if (status === "cancelled") return;

        const otAmt = parseFloat(c[5]) || 0;
        const moAmt = parseFloat(c[7]) || 0;
        const anAmt = parseFloat(c[9]) || 0;

        if (activeClientCategory === "monthly" && moAmt <= 0) return;
        if (activeClientCategory === "annual" && anAmt <= 0) return;
        if (activeClientCategory === "onetime" && otAmt <= 0) return;

        let serv = [];
        if (activeClientCategory === "all" || activeClientCategory === "onetime") {
          if (c[4] && otAmt > 0) serv.push(`One-Time: ${c[4]} (INR ${otAmt})`);
        }
        if (activeClientCategory === "all" || activeClientCategory === "monthly") {
          if (c[6] && moAmt > 0) serv.push(`Monthly: ${c[6]} (INR ${moAmt})`);
        }
        if (activeClientCategory === "all" || activeClientCategory === "annual") {
          if (c[8] && anAmt > 0) serv.push(`Annual: ${c[8]} (INR ${anAmt})`);
        }

        if (serv.length === 0 && activeClientCategory !== "all") return;

        cHtml += `
          <tr>
            <td><strong>${c[0]}</strong></td>
            <td><strong>${c[1]}</strong></td>
            <td>${c[2]}<br><span style="font-size:0.75rem; color:#64748b;">${c[3]}</span></td>
            <td>${serv.join("<br>") || "—"}</td>
            <td><strong>${c[10] ? c[10].substring(0,10) : "—"}</strong></td>
            <td style="text-align: right; white-space: nowrap;">
              <button class="btn-bill" onclick="openInvoiceModal('${c[0]}')">Generate Bill</button>
              <button class="btn-cancel-service" onclick="cancelClientService('${c[0]}')">Cancel Service</button>
              <button class="btn-edit" onclick="editClientRecord('${c[0]}')">Edit</button>
              <button class="btn-del" onclick="deleteClientRecord('${c[0]}')">Delete</button>
            </td>
          </tr>
        `;
      });
      clientBody.innerHTML = cHtml || '<tr><td colspan="6" style="text-align:center;">No accounts found for this filter.</td></tr>';

      const staffBody = document.getElementById("staffTableBody");
      let sTableHtml = "";
      let sOptions = '<option value="">Choose Staff Profile</option>';
      (state.staff || []).forEach(s => {
        sTableHtml += `
          <tr>
            <td><strong>${s[0]}</strong></td>
            <td><strong>${s[1]}</strong></td>
            <td>${s[2]}</td>
            <td>${s[3] || "—"}</td>
            <td><span class="status-badge">${s[4] || "Active"}</span></td>
            <td style="text-align: right; white-space: nowrap;">
              <button class="btn-edit" onclick="editStaffRecord('${s[0]}')">Edit</button>
              <button class="btn-del" onclick="deleteStaffRecord('${s[0]}')">Delete</button>
            </td>
          </tr>
        `;
        sOptions += `<option value="${s[0]}" data-email="${s[2]}" data-name="${s[1]}">${s[1]} (${s[0]}) — ${s[3]}</option>`;
      });
      staffBody.innerHTML = sTableHtml || '<tr><td colspan="6" style="text-align:center;">No personnel profiles found.</td></tr>';

      const staffSelect = document.getElementById("staffSelect");
      staffSelect.innerHTML = sOptions;

      const taskBody = document.getElementById("taskApprovalBody");
      let tHtml = "";
      (state.tasks || []).forEach(t => {
        if (t[6] === "Pending Approval") {
          tHtml += `
            <tr>
              <td><strong>${t[3]}</strong></td>
              <td>${t[2]}</td>
              <td>${t[7] || "—"}</td>
              <td><span class="status-badge" style="background:#fef3c7; color:#b45309;">${t[6]}</span></td>
              <td><button class="btn-primary" style="background:#10b981; padding: 4px 10px;" onclick="approveTask('${t[0]}')">Approve</button></td>
            </tr>
          `;
        }
      });
      taskBody.innerHTML = tHtml || '<tr><td colspan="5" style="text-align:center;">No deliverables awaiting approval.</td></tr>';
    }

    function saveClientRecord() {
      const id = document.getElementById("clientId").value;
      const client = {
        id: id,
        name: document.getElementById("custName").value.trim(),
        phone: document.getElementById("custPhone").value.trim(),
        email: document.getElementById("custEmail").value.trim(),
        nextBillingDate: document.getElementById("custDate").value,
        oneTimeService: document.getElementById("oneTimeTitle").value.trim(),
        oneTimeAmount: document.getElementById("oneTimeAmt").value,
        monthlyService: document.getElementById("monthlyTitle").value.trim(),

    function openInvoiceModal(clientId) {
      const c = (state.clients || []).find(item => String(item[0]).trim() === String(clientId).trim());
      if (!c) return;

      currentInvoice.client = c;
      currentInvoice.advances = [];
      currentInvoice.customItems = [];

      (state.payments || []).forEach(p => {
        if (String(p[1] || "").trim() === String(c[0]).trim() && parseFloat(p[4]) !== 0) {
          currentInvoice.advances.push({
            mode: p[6] ? (p[6].includes("[") ? p[6].split("[")[1].replace("]", "") : "Direct") : "Direct",
            amount: parseFloat(p[4]),
            note: p[6] ? p[6].split("[")[0].trim() : "Installment"
          });
        }
      });
      
      document.getElementById("invoiceCycleSelector").value = "monthly";
      document.getElementById("advDate").value = new Date().toISOString().split("T")[0];
      changeInvoiceCycle();

      document.getElementById("modalClientHeader").innerText = `Generating bill for: ${c[1]} (${c[0]})`;
      document.getElementById("previewCustName").innerText = c[1];
      document.getElementById("previewCustAddress").innerHTML = `Phone: ${c[2] || '—'}<br>Email: ${c[3] || '—'}`;

      document.getElementById("invoiceModal").style.display = "flex";
    }

    function changeInvoiceCycle() {
      const c = currentInvoice.client;
      if (!c) return;

      const cycle = document.getElementById("invoiceCycleSelector").value;
      currentInvoice.lineItems = [];

      const now = new Date();
      const currentMonthStr = now.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
      const currentYear = now.getFullYear();

      let termLabel = "Net 15 Days";
      let dueOffsetDays = 15;

      if (cycle === "monthly") {
        if (c[6] && parseFloat(c[7]) > 0) {
          currentInvoice.lineItems.push({
            name: c[6],
            desc: `Monthly Recurring Service Retainer (${currentMonthStr})`,
            price: parseFloat(c[7]),
            qty: 1
          });
        }
        termLabel = "Monthly Retainer (Net 7)";
        dueOffsetDays = 7;
      } else if (cycle === "initial") {
        if (c[4] && parseFloat(c[5]) > 0) {
          currentInvoice.lineItems.push({
            name: c[4],
            desc: "One-Time Initial Setup & Project Deployment",
            price: parseFloat(c[5]),
            qty: 1
          });
        }
        if (c[6] && parseFloat(c[7]) > 0) {
          currentInvoice.lineItems.push({
            name: c[6],
            desc: `1st Month Service Retainer (${currentMonthStr})`,
            price: parseFloat(c[7]),
            qty: 1
          });
        }
        termLabel = "Due on Receipt";
        dueOffsetDays = 0;
      } else if (cycle === "annual") {
        if (c[8] && parseFloat(c[9]) > 0) {
          currentInvoice.lineItems.push({
            name: c[8],
            desc: `Annual AMC, Cloud Infrastructure & Maintenance (${currentYear} - ${currentYear + 1})`,
            price: parseFloat(c[9]),
            qty: 1
          });
        }
        termLabel = "Annual Subscription (Net 15)";
        dueOffsetDays = 15;
      } else {
        if (c[4] && parseFloat(c[5]) > 0) currentInvoice.lineItems.push({ name: c[4], desc: "One-Time Custom Setup", price: parseFloat(c[5]), qty: 1 });
        if (c[6] && parseFloat(c[7]) > 0) currentInvoice.lineItems.push({ name: c[6], desc: "Monthly Recurring Retainer", price: parseFloat(c[7]), qty: 1 });
        if (c[8] && parseFloat(c[9]) > 0) currentInvoice.lineItems.push({ name: c[8], desc: "Annual Contract", price: parseFloat(c[9]), qty: 1 });
        termLabel = "Consolidated Statement";
        dueOffsetDays = 0;
      }

      currentInvoice.customItems.forEach(ci => {
        currentInvoice.lineItems.push(ci);
      });

      if (currentInvoice.lineItems.length === 0) {
        currentInvoice.lineItems.push({ name: "Agency Services", desc: "Digital Technology Consulting", price: 2000, qty: 1 });
      }

      const invCode = "INV-" + Math.floor(100000 + Math.random() * 900000);
      document.getElementById("previewInvNumber").innerText = `# ${invCode}`;

      const todayFormatted = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      document.getElementById("previewInvDate").innerText = todayFormatted;
      document.getElementById("previewTerms").innerText = termLabel;

      const calculatedDueDate = new Date(now.getTime() + dueOffsetDays * 24 * 60 * 60 * 1000);
      document.getElementById("previewDueDate").innerText = calculatedDueDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      
      const rolloverTarget = new Date(now);
      if (cycle === "annual") {
        rolloverTarget.setFullYear(rolloverTarget.getFullYear() + 1);
      } else {
        rolloverTarget.setMonth(rolloverTarget.getMonth() + 1);
      }
      currentInvoice.calculatedNextDue = rolloverTarget.toISOString().split('T')[0];

      renderInvoicePreview();
    }

    function addCustomBillItem() {
      const title = document.getElementById("customItemTitle").value.trim();
      const amt = parseFloat(document.getElementById("customItemAmt").value) || 0;
      const qty = parseFloat(document.getElementById("customItemQty").value) || 1;

        showToast("Enter valid custom item name and amount.");

      }

      currentInvoice.customItems.push({

        desc: "Custom Bill Item",
        price: amt,
        qty: qty

      document.getElementById("customItemTitle").value = "";
      document.getElementById("customItemAmt").value = "";
      document.getElementById("customItemQty").value = "1";

    function addAdvanceReceipt() {
      const c = currentInvoice.client;
      if (!c) return;

      const mode = document.getElementById("advMode").value;
      const amt = parseFloat(document.getElementById("advAmount").value) || 0;
      const payDate = document.getElementById("advDate").value;
      const note = document.getElementById("advNote").value.trim() || "Installment";

      if (amt <= 0) { showToast("Enter a valid installment amount."); return; }

      const btn = document.getElementById("btnCommitAdvance");
      btn.disabled = true;
      btn.innerText = "Saving Installment...";

      window.onAdvanceRecorded = function(res) {
        btn.disabled = false;
        btn.innerText = "Record & Save Installment";
        if (res && res.success) {
          currentInvoice.advances.push({
            mode: mode,
            amount: amt,
            note: note + (payDate ? ` (${payDate})` : '')
          });
          document.getElementById("advAmount").value = "";
          document.getElementById("advNote").value = "";
          renderInvoicePreview();
          showToast("Installment of INR " + amt.toFixed(2) + " saved successfully.");
          syncAllData();
        } else {
          showToast("Failed to write installment record.");
        }
      };

      jsonp(API_ENDPOINT + `?action=recordAdvancePayment&clientId=${encodeURIComponent(c[0])}&amount=${encodeURIComponent(amt)}&mode=${encodeURIComponent(mode)}&note=${encodeURIComponent(note)}&payDate=${encodeURIComponent(payDate)}`, "onAdvanceRecorded");
    }

    function renderInvoicePreview() {
      const lineBody = document.getElementById("previewLineItems");
      let subtotal = 0;
      let lHtml = "";
      currentInvoice.lineItems.forEach((item, idx) => {
        const itemTotal = item.qty * item.price;
        subtotal += itemTotal;
        lHtml += `
          <tr>
            <td style="text-align: center; color:#64748b;">${idx + 1}</td>
            <td>
              <strong>${item.name}</strong>
              <span class="item-sub-desc">${item.desc}</span>
            </td>
            <td style="text-align: center;">${item.qty.toFixed(2)}<br><span style="font-size:0.68rem; color:#94a3b8;">Nos</span></td>
            <td style="text-align: right;">${item.price.toFixed(2)}</td>
            <td style="text-align: right; font-weight:700;">${itemTotal.toFixed(2)}</td>
          </tr>
        `;
      });
      lineBody.innerHTML = lHtml;

      const advBox = document.getElementById("previewAdvanceBox");
      const advBody = document.getElementById("previewAdvanceItems");
      let totalPaid = 0;

      if (currentInvoice.advances.length > 0) {
        advBox.style.display = "block";
        let aHtml = "";
        currentInvoice.advances.forEach(a => {
          totalPaid += a.amount;
          aHtml += `
            <tr>
              <td colspan="2"><strong>${a.note}</strong></td>
              <td style="text-align: center; color:#64748b; font-size:0.75rem;">${a.mode}</td>
              <td colspan="2" style="text-align: right; font-weight:700; color:#059669;">(-) ${a.amount.toFixed(2)}</td>
            </tr>
          `;
        });
        advBody.innerHTML = aHtml;
      } else {
        advBox.style.display = "none";
      }

      const taxRate = parseFloat(document.getElementById("invTaxRate").value) || 0;
      const discountRate = parseFloat(document.getElementById("invDiscountRate").value) || 0;

      const discountAmt = subtotal * (discountRate / 100);
      const taxableAmount = Math.max(0, subtotal - discountAmt);
      const taxAmt = taxableAmount * (taxRate / 100);
      const grandTotal = taxableAmount + taxAmt;
      const balanceDue = Math.max(0, grandTotal - totalPaid);

      currentInvoice.financials = {
        subtotal: subtotal.toFixed(2),
        total: grandTotal.toFixed(2),
        paid: totalPaid.toFixed(2),
        balanceDue: balanceDue.toFixed(2)
      };

      document.getElementById("prevSubtotal").innerText = subtotal.toFixed(2);

      const rowDisc = document.getElementById("rowDiscount");
      if (discountRate > 0) {
        rowDisc.style.display = "table-row";
        document.getElementById("lblDiscount").innerText = `Discount(${discountRate}%)`;
        document.getElementById("prevDiscount").innerText = `(-) ${discountAmt.toFixed(2)}`;
      } else {
        rowDisc.style.display = "none";
      }

      const rowTax = document.getElementById("rowTax");
      if (taxRate > 0) {
        rowTax.style.display = "table-row";
        document.getElementById("lblTax").innerText = `Sales Tax (${taxRate}%)`;
        document.getElementById("prevTax").innerText = taxAmt.toFixed(2);
      } else {
        rowTax.style.display = "none";
      }

      document.getElementById("prevTotal").innerText = `INR ${grandTotal.toFixed(2)}`;

      const rowPaid = document.getElementById("rowPaid");
      if (totalPaid > 0) {
        rowPaid.style.display = "table-row";
        document.getElementById("prevPaid").innerText = `(-) INR ${totalPaid.toFixed(2)}`;
      } else {
        rowPaid.style.display = "none";
      }

      document.getElementById("prevDue").innerText = `INR ${balanceDue.toFixed(2)}`;
      document.getElementById("topBalanceDue").innerText = `INR ${balanceDue.toFixed(2)}`;

      const upi = document.getElementById("invUpiId").value.trim();
      const qrBox = document.getElementById("invoiceQr");
      qrBox.innerHTML = "";

      if (upi && balanceDue > 0) {
        const qrPayload = `upi://pay?pa=${encodeURIComponent(upi)}&pn=Ofbuzz%20Technology&am=${balanceDue.toFixed(2)}&cu=INR`;
        new QRCode(qrBox, { text: qrPayload, width: 125, height: 125 });
      }
    }
