<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Studio & Operations — Ofbuzz Technology</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary: #f25c3b;
      --primary-dark: #d94827;
      --meta-blue: #1877f2;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px 16px 80px; }
    .container { max-width: 1240px; margin: 0 auto; }

    #authOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; z-index: 9999; display: flex;
      align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
      background: #ffffff; width: 100%; max-width: 380px; border-radius: 16px;
      padding: 32px 28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center;
    }
    .auth-logo { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; margin-bottom: 12px; }
    .auth-title { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .auth-sub { font-size: 0.8rem; color: #64748b; margin-bottom: 20px; }
    .auth-input {
      width: 100%; padding: 12px; font-size: 1.2rem; text-align: center;
      letter-spacing: 6px; border: 2px solid #e2e8f0; border-radius: 10px;
      outline: none; margin-bottom: 16px; transition: all 0.2s; font-family: 'JetBrains Mono', monospace;
    }
    .auth-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(242, 92, 59, 0.2); }
    .auth-btn { width: 100%; padding: 12px; font-size: 0.95rem; font-weight: 700; border-radius: 10px; background: var(--primary); color: #fff; border: none; cursor: pointer; }
    .auth-btn:hover { background: var(--primary-dark); }
    .auth-error { color: var(--danger); font-size: 0.8rem; margin-top: 10px; font-weight: 600; display: none; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); padding: 16px 24px; border-radius: var(--radius);
      border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .brand-box { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
    .brand-title { font-size: 1.15rem; font-weight: 800; color: var(--text); }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--surface); padding: 18px; border-radius: var(--radius); border: 1px solid var(--border); border-left: 4px solid var(--primary); }
    .kpi-title { font-size: 0.8rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }
    .kpi-val { font-size: 1.5rem; font-weight: 800; margin-top: 6px; color: var(--text); }

    #analyticsPanel {
      display: none; background: #ffffff; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .meta-analytics-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 14px;
    }
    .meta-live-badge {
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 800;
      color: #0f172a; background: #f1f5f9; padding: 6px 14px; border-radius: 20px; border: 1px solid #cbd5e1;
    }
    .analytics-control-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .time-filter-group { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 10px; }
    .time-pill {
      padding: 6px 14px; border: none; background: transparent; font-size: 0.78rem;
      font-weight: 700; color: #64748b; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .time-pill.active { background: #ffffff; color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .custom-range-inputs { display: inline-flex; align-items: center; gap: 6px; background: #f1f5f9; padding: 4px 8px; border-radius: 8px; font-size: 0.75rem; }
    .custom-range-inputs input[type="date"] { padding: 4px 6px; font-size: 0.75rem; border: 1px solid var(--border); border-radius: 6px; }

    .ig-insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .ig-insight-card {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 18px;
      position: relative; overflow: hidden; transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .ig-insight-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
    .ig-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .ig-card-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.03em; }
    .ig-growth-badge { font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 20px; display: inline-flex; align-items: center; gap: 3px; }
    .badge-positive { background: #dcfce7; color: #166534; }
    .badge-neutral { background: #e0f2fe; color: #0369a1; }
    .badge-alert { background: #ffedd5; color: #c2410c; font-weight: 800; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; border: 1px solid #fed7aa; }
    .badge-severe { background: #fef2f2; color: #b91c1c; font-weight: 800; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; border: 1px solid #fecaca; }

    .ig-card-value { font-size: 1.6rem; font-weight: 800; color: #0f172a; margin-bottom: 6px; letter-spacing: -0.02em; }
    .ig-card-sub { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
    .ig-progress-container { margin-top: 10px; }
    .ig-progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .ig-progress-fill { height: 100%; background: var(--meta-blue); border-radius: 4px; width: 0%; transition: width 0.6s ease; }

    .charts-grid { display: grid; grid-template-columns: 2fr 1.1fr; gap: 18px; margin-bottom: 20px; }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
