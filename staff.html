<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal - Ofbuzz Technology</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8f9fa; color: #212529; margin: 0; padding: 16px; }
    .container { max-width: 580px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; }
    .header { text-align: center; margin-bottom: 16px; }
    .logo { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; display: block; margin: 0 auto 8px auto; }
    input, textarea, button { width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
    button { background: #0d6efd; color: #ffffff; border: none; cursor: pointer; font-weight: 500; }
    button.alt { background: #198754; margin-top: 10px; }
    .task-card { border: 1px solid #dee2e6; border-radius: 6px; padding: 12px; margin-top: 10px; background: #ffffff; }
    .badge { display: inline-block; padding: 3px 6px; font-size: 11px; border-radius: 4px; font-weight: 500; }
    .badge-Assigned { background: #fff3cd; color: #664d03; }
    .badge-Pending { background: #cff4fc; color: #055160; }
    .badge-Approved { background: #d1e7dd; color: #0f5132; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="<?= logoUrl ?>" class="logo" alt="Ofbuzz Technology Logo" referrerpolicy="no-referrer">
      <h2 style="font-size:17px; margin:0;">Staff Workspace</h2>
    </div>
    <div>
      <label style="font-size:12px;">Staff ID</label>
      <input type="text" id="sid" placeholder="e.g. STF01">
      <label style="font-size:12px; margin-top:8px; display:block;">Full Name</label>
      <input type="text" id="sname" placeholder="Enter Full Name">
      <button class="alt" id="btnAtt" onclick="markAtt()">Mark Daily Attendance</button>
      <div id="attRes" style="font-size:13px; margin-top:6px;"></div>
      <button id="btnTask" onclick="fetchTasks()" style="margin-top:8px;">View My Tasks</button>
    </div>
    <div style="margin-top:16px; border-top:1px solid #e9ecef; padding-top:12px;">
      <h3 style="font-size:14px; margin:0 0 10px;">Assigned Tasks</h3>
      <div id="tlist"><p style="font-size:13px; color:#6c757d;">Enter Staff ID and click View My Tasks.</p></div>
    </div>
  </div>

  <script>
    function markAtt() {
      var id = document.getElementById("sid").value.trim();
      var name = document.getElementById("sname").value.trim();
      var btn = document.getElementById("btnAtt");
      var resBox = document.getElementById("attRes");

      if (!id || !name) { alert("Enter both Staff ID and Name."); return; }
      btn.disabled = true; btn.innerText = "Marking...";

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.innerText = "Mark Daily Attendance";
          resBox.innerText = res.message;
          resBox.style.color = res.success ? "#198754" : "#dc3545";
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.innerText = "Mark Daily Attendance";
          alert("Error: " + err.message);
        })
        .markAttendance(id, name);
    }

    function fetchTasks() {
      var id = document.getElementById("sid").value.trim();
      var btn = document.getElementById("btnTask");
      if (!id) { alert("Enter Staff ID."); return; }

      btn.disabled = true; btn.innerText = "Loading...";

      google.script.run
        .withSuccessHandler(function(tasks) {
          btn.disabled = false; btn.innerText = "View My Tasks";
          var box = document.getElementById("tlist");
          if (!tasks || tasks.length === 0) {
            box.innerHTML = "<p style='font-size:13px; color:#6c757d;'>No tasks found for ID: " + id + "</p>";
            return;
          }
          var h = "";
          tasks.forEach(function(t) {
            var cls = t.status === "Pending Approval" ? "badge-Pending" : (t.status === "Approved" ? "badge-Approved" : "badge-Assigned");
            h += "<div class='task-card'>" +
                 "  <div style='display:flex; justify-content:space-between;'>" +
                 "    <strong>" + t.title + "</strong>" +
                 "    <span class='badge " + cls + "'>" + t.status + "</span>" +
                 "  </div>" +
                 "  <p style='font-size:13px; color:#495057; margin:6px 0;'>" + t.description + "</p>";
            if (t.status === "Assigned") {
              h += "<textarea id='rm_" + t.id + "' placeholder='Optional remarks...'></textarea>" +
                   "<button onclick='finishTask(\"" + t.id + "\")'>Mark Completed</button>";
            } else {
              h += "<div style='font-size:12px; color:#6c757d; margin-top:4px;'>Status: " + t.status + "</div>";
            }
            h += "</div>";
          });
          box.innerHTML = h;
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.innerText = "View My Tasks";
          alert("Error loading tasks: " + err.message);
        })
        .getStaffTasks(id);
    }

    function finishTask(tid) {
      var rem = document.getElementById("rm_" + tid).value;
      google.script.run
        .withSuccessHandler(function() {
          alert("Task submitted for admin approval.");
          fetchTasks();
        })
        .withFailureHandler(function(err) {
          alert("Error: " + err.message);
        })
        .submitTaskCompletion(tid, rem);
    }
  </script>
</body>
</html>
