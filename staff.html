<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workforce Workspace - Ofbuzz Technology</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f8f9fa; color: #212529; margin: 0; padding: 16px; }
    .container { max-width: 580px; margin: 0 auto; background: #ffffff; padding: 22px; border-radius: 8px; border: 1px solid #e9ecef; }
    .header { text-align: center; margin-bottom: 20px; }
    .brand-logo { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; display: block; margin: 0 auto 10px auto; }
    h2 { font-size: 18px; margin: 0; font-weight: 600; }
    label { display: block; font-size: 12px; margin-top: 10px; font-weight: 500; color: #495057; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
    button { background: #0d6efd; color: #ffffff; border: none; cursor: pointer; font-weight: 500; }
    button.btn-success { background: #198754; margin-top: 12px; }
    .task-card { border: 1px solid #dee2e6; border-radius: 6px; padding: 14px; margin-top: 12px; background: #ffffff; }
    .badge { display: inline-block; padding: 3px 6px; font-size: 11px; border-radius: 4px; font-weight: 500; }
    .badge-Assigned { background: #fff3cd; color: #664d03; }
    .badge-Pending { background: #cff4fc; color: #055160; }
    .badge-Approved { background: #d1e7dd; color: #0f5132; }
    .status-msg { font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg" class="brand-logo" alt="Ofbuzz Technology Identity" referrerpolicy="no-referrer">
      <h2>Workforce Operations</h2>
    </div>

    <div>
      <label>Operational Associate Identifier (Staff ID)</label>
      <input type="text" id="workforceId" placeholder="Example: STF01">
      <label>Complete Name</label>
      <input type="text" id="workforceName" placeholder="Provide full corporate name">
      <button class="btn-success" id="btnAttendance" onclick="logAttendance()">Log Daily Attendance</button>
      <div id="attendanceFeedback" class="status-msg"></div>
      <button id="btnFetchTasks" onclick="retrieveTasks()" style="margin-top:10px;">Retrieve Assignments</button>
    </div>

    <div style="margin-top:20px; border-top:1px solid #e9ecef; padding-top:14px;">
      <h3 style="font-size:15px; margin:0 0 10px;">Assigned Deliverables</h3>
      <div id="assignmentQueue">
        <p style="font-size:13px; color:#6c757d;">Authenticate with your Staff ID to query delegated tasks.</p>
      </div>
    </div>
  </div>

  <script>
    function logAttendance() {
      var id = document.getElementById("workforceId").value.trim();
      var name = document.getElementById("workforceName").value.trim();
      var button = document.getElementById("btnAttendance");
      var feedback = document.getElementById("attendanceFeedback");

      if (!id || !name) {
        alert("Both Staff ID and Full Name are mandatory for identity verification.");
        return;
      }
      button.disabled = true;
      button.innerText = "Processing authentication...";

      google.script.run
        .withSuccessHandler(function(response) {
          button.disabled = false;
          button.innerText = "Log Daily Attendance";
          feedback.innerText = response.message;
          feedback.style.color = response.success ? "#198754" : "#dc3545";
        })
        .withFailureHandler(function(fault) {
          button.disabled = false;
          button.innerText = "Log Daily Attendance";
          alert("System fault: " + fault.message);
        })
        .markAttendance(id, name);
    }

    function retrieveTasks() {
      var id = document.getElementById("workforceId").value.trim();
      var button = document.getElementById("btnFetchTasks");
      if (!id) {
        alert("Enter your designated Staff ID.");
        return;
      }

      button.disabled = true;
      button.innerText = "Querying operational records...";

      google.script.run
        .withSuccessHandler(function(records) {
          button.disabled = false;
          button.innerText = "Retrieve Assignments";
          var queue = document.getElementById("assignmentQueue");
          if (!records || records.length === 0) {
            queue.innerHTML = '<p style="font-size:13px; color:#6c757d;">No deliverables assigned for Staff ID: ' + id + '</p>';
            return;
          }
          var output = "";
          records.forEach(function(item) {
            var badgeClass = item.status === "Pending Approval" ? "badge-Pending" : (item.status === "Approved" ? "badge-Approved" : "badge-Assigned");
            output += '<div class="task-card">';
            output += '  <div style="display:flex; justify-content:space-between; align-items:center;">';
            output += '    <strong>' + item.title + '</strong>';
            output += '    <span class="badge ' + badgeClass + '">' + item.status + '</span>';
            output += '  </div>';
            output += '  <p style="font-size:13px; color:#495057; margin:8px 0;">' + item.description + '</p>';
            
            if (item.status === "Assigned") {
              output += '  <textarea id="remark_' + item.id + '" placeholder="Optional delivery remarks..."></textarea>';
              output += '  <button onclick="markTaskComplete(\'' + item.id + '\')" style="margin-top:6px;">Submit for Verification</button>';
            } else if (item.status === "Pending Approval") {
              output += '  <div style="font-size:12px; color:#055160; margin-top:6px;">Verification Status: Awaiting Administrative Sign-Off</div>';
            } else if (item.status === "Approved") {
              output += '  <div style="font-size:12px; color:#0f5132; margin-top:6px;">Approved' + (item.adminRemark ? ': ' + item.adminRemark : '') + '</div>';
            }
            output += '</div>';
          });
          queue.innerHTML = output;
        })
        .withFailureHandler(function(fault) {
          button.disabled = false;
          button.innerText = "Retrieve Assignments";
          alert("Database exception: " + fault.message);
        })
        .getStaffTasks(id);
    }

    function markTaskComplete(taskId) {
      var remarkInput = document.getElementById("remark_" + taskId);
      var remarkValue = remarkInput ? remarkInput.value : "";
      
      google.script.run
        .withSuccessHandler(function() {
          alert("Task marked complete and routed to verification queue.");
          retrieveTasks();
        })
        .withFailureHandler(function(fault) {
          alert("Submission fault: " + fault.message);
        })
        .submitTaskCompletion(taskId, remarkValue);
    }
  </script>
</body>
</html>
