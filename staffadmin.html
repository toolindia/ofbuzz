<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal & Operations — Ofbuzz Technology</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #f25c3b;
      --primary-dark: #d94827;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px 16px 80px; }
    .container { max-width: 900px; margin: 0 auto; }

    /* AUTH OVERLAY */
    #staffAuthOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; z-index: 9999; display: flex;
      align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
      background: #ffffff; width: 100%; max-width: 400px; border-radius: 16px;
      padding: 32px 28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center;
    }
    .auth-logo { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; margin-bottom: 12px; }
    .auth-title { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .auth-sub { font-size: 0.8rem; color: #64748b; margin-bottom: 20px; }
    .auth-select, .auth-input {
      width: 100%; padding: 12px; font-size: 0.95rem; border: 2px solid #e2e8f0;
      border-radius: 10px; outline: none; margin-bottom: 14px; transition: all 0.2s;
    }
    .auth-select:focus, .auth-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(242, 92, 59, 0.2); }
    .auth-pin-input {
      letter-spacing: 4px; text-align: center; font-size: 1.1rem; font-family: 'JetBrains Mono', monospace;
    }
    .auth-btn { width: 100%; padding: 12px; font-size: 0.95rem; font-weight: 700; border-radius: 10px; background: var(--primary); color: #fff; border: none; cursor: pointer; }
    .auth-btn:hover { background: var(--primary-dark); }
    .auth-error { color: var(--danger); font-size: 0.8rem; margin-top: 10px; font-weight: 600; display: none; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); padding: 16px 24px; border-radius: var(--radius);
      border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .brand-box { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
    .brand-title { font-size: 1.15rem; font-weight: 800; color: var(--text); }

    .task-card {
      background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 22px; margin-bottom: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.02);
    }
    .task-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .task-title { font-size: 1rem; font-weight: 800; color: #0f172a; }
    .task-badge {
      font-size: 0.72rem; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase;
    }
    .badge-assigned { background: #fef3c7; color: #d97706; }
    .badge-pending { background: #e0f2fe; color: #0284c7; }
    .badge-approved { background: #dcfce7; color: #166534; }

    .task-desc { font-size: 0.85rem; color: #475569; margin-bottom: 14px; line-height: 1.5; }
    textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.85rem; outline: none; margin-bottom: 12px; resize: vertical; min-height: 70px;
    }
    textarea:focus { border-color: var(--primary); }

    button { padding: 9px 16px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
    .btn-submit { background: var(--primary); color: #fff; }
    .btn-submit:hover { background: var(--primary-dark); }
    .btn-attendance { background: #10b981; color: #fff; }
    .btn-attendance:hover { background: #059669; }
    .btn-logout { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .btn-logout:hover { background: var(--danger); color: #fff; }

    .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; background: #0f172a; color: #fff; font-size: 0.85rem; font-weight: 600; display: none; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="staffAuthOverlay">
    <div class="auth-card">
      <img src="https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg" class="auth-logo" alt="Ofbuzz Logo">
      <h2 class="auth-title">Staff Portal Login</h2>
      <p class="auth-sub">Select profile and enter PIN (1312) to access</p>

      <select id="staffLoginSelect" class="auth-select">
        <option value="">Fetching active staff profiles...</option>
      </select>

      <input type="password" id="staffPinInput" class="auth-input auth-pin-input" maxlength="4" placeholder="••••" onkeypress="if(event.key === 'Enter') loginStaffUser()">

      <button class="auth-btn" onclick="loginStaffUser()">Unlock Workspace</button>
      <div id="authErrorMsg" class="auth-error">Incorrect PIN (1312) or Staff not selected.</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- MAIN STAFF CONSOLE -->
  <div class="container" id="staffDashboard" style="display: none;">
    <header>
      <div class="brand-box">
        <img src="https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg" class="brand-logo" alt="Ofbuzz Logo">
        <div>
          <div class="brand-title" id="displayStaffName">Staff Workspace</div>
          <p style="font-size: 0.75rem; color: var(--text-muted);" id="displayStaffMeta">ID: — | Role: —</p>
        </div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="btn-attendance" id="btnPunchAttendance" onclick="punchAttendance()">Punch Attendance</button>
        <button class="btn-submit" onclick="loadStaffTasks()">Refresh Tasks</button>
        <button class="btn-logout" onclick="logoutStaff()">Logout</button>
      </div>
    </header>

    <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 16px;">Assigned Deliverables Queue</h3>
    <div id="taskListContainer">
      <div style="text-align: center; padding: 30px; color: #64748b;">Loading deliverables...</div>
    </div>
  </div>

  <script>
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycby9yiIo9euB9KTt0zBuwcF3x6pdaeJJ48mAwcTFC6xl53oH8eh0Agfwlr138t3D5KNPYQ/exec";
    const STAFF_PORTAL_PIN = "1312";

    let currentStaff = { id: "", name: "", email: "", role: "" };

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg; toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    function jsonp(url, callbackName) {
      const script = document.createElement("script");
      script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName + "&_t=" + Date.now();
      document.body.appendChild(script);
      script.onload = () => script.remove();
      script.onerror = () => { script.remove(); showToast("Network request failed."); };
    }

    function initLoginPage() {
      const savedStaff = localStorage.getItem("ofbuzz_staff_auth");
      if (savedStaff) {
        currentStaff = JSON.parse(savedStaff);
        showWorkspace();
        return;
      }
      jsonp(API_ENDPOINT + "?action=getAdminData", "onStaffListLoaded");
    }

    window.onStaffListLoaded = function(res) {
      const select = document.getElementById("staffLoginSelect");
      if (res && res.success && res.data && res.data.staff) {
        let optHtml = '<option value="">-- Choose Your Staff Profile --</option>';
        res.data.staff.forEach(s => {
          const id = Array.isArray(s) ? s[0] : (s.staffId || s.id);
          const name = Array.isArray(s) ? s[1] : (s.staffName || s.name);
          const role = Array.isArray(s) ? s[3] : s.role;
          if (id || name) {
            optHtml += `<option value="${id}" data-name="${name}" data-role="${role || 'Staff'}">${name} (${id} - ${role || 'Staff'})</option>`;
          }
        });
        select.innerHTML = optHtml;
      }
    };

    function loginStaffUser() {
      const select = document.getElementById("staffLoginSelect");
      const enteredPin = document.getElementById("staffPinInput").value.trim();
      const errorMsg = document.getElementById("authErrorMsg");

      if (enteredPin !== STAFF_PORTAL_PIN) {
        errorMsg.innerText = "Incorrect PIN (1312). Access Denied.";
        errorMsg.style.display = "block";
        return;
      }

      if (!select.value) {
        errorMsg.innerText = "Please select your staff profile.";
        errorMsg.style.display = "block";
        return;
      }

      const opt = select.options[select.selectedIndex];
      currentStaff = {
        id: select.value,
        name: opt.getAttribute("data-name") || "Staff",
        role: opt.getAttribute("data-role") || "Staff"
      };

      localStorage.setItem("ofbuzz_staff_auth", JSON.stringify(currentStaff));
      errorMsg.style.display = "none";
      showWorkspace();
    }

    function showWorkspace() {
      document.getElementById("staffAuthOverlay").style.display = "none";
      document.getElementById("staffDashboard").style.display = "block";
      document.getElementById("displayStaffName").innerText = currentStaff.name;
      document.getElementById("displayStaffMeta").innerText = `Staff ID: ${currentStaff.id} | Role: ${currentStaff.role}`;
      loadStaffTasks();
    }

    function logoutStaff() {
      localStorage.removeItem("ofbuzz_staff_auth");
      location.reload();
    }

    function punchAttendance() {
      const btn = document.getElementById("btnPunchAttendance");
      btn.disabled = true; btn.innerText = "Punching...";
      jsonp(API_ENDPOINT + `?action=markAttendance&staffId=${encodeURIComponent(currentStaff.id)}&staffName=${encodeURIComponent(currentStaff.name)}`, function(res) {
        btn.disabled = false;
        btn.innerText = "Attendance Logged";
        btn.style.background = "#059669";
        showToast("Attendance recorded in Google Sheet!");
      });
    }

    function loadStaffTasks() {
      jsonp(API_ENDPOINT + `?action=getStaffTasks&staffId=${encodeURIComponent(currentStaff.id)}`, "onTasksLoaded");
    }

    window.onTasksLoaded = function(res) {
      const container = document.getElementById("taskListContainer");
      if (!res || !res.success || !Array.isArray(res.data) || res.data.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;">No deliverables currently assigned.</div>';
        return;
      }

      let html = "";
      res.data.forEach(t => {
        const status = (t.status || "Assigned").toUpperCase();
        const isAssigned = (status === "ASSIGNED");
        const isPending = (status === "PENDING APPROVAL");

        let badgeClass = "badge-assigned";
        if (isPending) badgeClass = "badge-pending";
        if (status === "APPROVED") badgeClass = "badge-approved";

        html += `
          <div class="task-card" id="card_${t.id}">
            <div class="task-card-head">
              <div class="task-title">${t.title}</div>
              <span class="task-badge ${badgeClass}" id="badge_${t.id}">${status}</span>
            </div>
            <div class="task-desc">${t.description || 'No description provided.'}</div>
            
            ${isAssigned ? `
              <textarea id="remark_\${t.id}" placeholder="Provide completion notes, deliverable links, or execution remarks..."></textarea>
              <div style="text-align: right;">
                <button class="btn-submit" id="btn_${t.id}" onclick="submitDeliverable('${t.id}')">Submit for Administrative Verification</button>
              </div>
            ` : (isPending ? `
              <div style="background: #f8fafc; border: 1px dashed #cbd5e1; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #64748b;">
                <strong>Remark submitted:</strong> \${t.staffRemark || 'Deliverable submitted for review.'}
                <div style="color: #0284c7; font-weight: 700; margin-top: 4px;">Awaiting verification from Admin Studio</div>
              </div>
            ` : `
              <div style="background: #ecfdf5; border: 1px solid #d1fae5; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #166534;">
                <strong>Deliverable Verified & Approved</strong>
              </div>
            `)}
          </div>
        `;
      });

      container.innerHTML = html;
    };

    function submitDeliverable(taskId) {
      const remarkInput = document.getElementById("remark_" + taskId);
      const remark = remarkInput ? remarkInput.value.trim() : "Deliverable submitted";
      const btn = document.getElementById("btn_" + taskId);

      if (btn) {
        btn.disabled = true;
        btn.innerText = "Submitting...";
      }

      showToast("Submitting deliverable...");
      jsonp(API_ENDPOINT + `?action=submitTaskCompletion&taskId=${encodeURIComponent(taskId)}&remark=${encodeURIComponent(remark)}`, function(res) {
        if (res && res.success) {
          showToast("Deliverable submitted for review.");
          loadStaffTasks();
        } else {
          if (btn) {
            btn.disabled = false;
            btn.innerText = "Submit for Administrative Verification";
          }
          showToast("Failed to submit deliverable.");
        }
      });
    }

    window.onload = initLoginPage;
  </script>
</body>
</html>
